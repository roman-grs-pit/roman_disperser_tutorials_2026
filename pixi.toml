[workspace]
authors = ["Nikhil Padmanabhan <nikhil.padmanabhan@gmail.com>"]
channels = ["conda-forge"]
name = "roman_disperser_tutorials"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

# Developer-only environment for authoring/testing the tutorials. Users do
# NOT use pixi — they use conda (NERSC/RRN) or pip (laptop). See CLAUDE.md.

[dependencies]
python = ">=3.12, <3.13"

[pypi-dependencies]
# Pull the disperser from git (not the ../roman_disperser sibling) so this
# repo is reproducible off a laptop — on the GPU box, in CI, etc. [full]
# brings astropy/synphot/tqdm/pytest. Pinned to v0.14.2 (elements API +
# prism support + lock-resolved reference data); bump as the tutorials
# track new releases.
#
# SSH URL (not https): the disperser repo is private, and this dev manifest
# resolves via the maintainer's registered SSH key. Laptop *users* use the
# https form + `gh auth login` (see environment.yml / docs/SETUP.md).
roman_disperser = { git = "ssh://git@github.com/roman-grs-pit/roman_disperser.git", tag = "v0.14.2", extras = ["full"] }

[tasks]
# Confirm which JAX backend is live in the active environment.
check-jax = "python -c 'import jax; print(f\"Backend: {jax.default_backend()}\"); print(jax.devices())'"
# Hydrate reference data into the dev data dir (PIXI_PROJECT_ROOT/data). Flags
# pass through, e.g. `pixi run hydrate --only optical_model,sensitivities,synphot`.
hydrate = "roman-disperser-hydrate"
# One-time per clone: install the nbstripout git filter (keeps local outputs,
# strips them only in what git stores). See scripts/setup_nbstripout.sh.
setup-nbstripout = "bash scripts/setup_nbstripout.sh"
# Manual fallback: strip outputs from the notebook FILES in place (also clears
# your working copy). Prefer the git filter above for routine commits.
clear-nb = "bash scripts/clear_notebook_outputs.sh"

# --- ENVIRONMENTS ---
# Both envs bundle romanisim (the full disperse -> wrap pipeline), so users
# never switch kernels. default = CPU (laptop / RRN / NERSC-CPU) ->
# environment-cpu.yml; gpu = CUDA (NERSC-GPU / GPU box, linux-64) ->
# environment-gpu.yml.
[environments]
default = ["cpu", "notebook", "romanisim"]
gpu = ["cuda", "notebook", "romanisim"]
# Maintainer-only superset: adds authoring tools (nbstripout for the git
# output-stripping filter). NOT exported to the user conda envs, which are
# generated from `default`/`gpu` only.
dev = ["cpu", "notebook", "romanisim", "dev"]

# --- FEATURES ---

# Notebook tooling shared by every environment.
[feature.notebook.dependencies]
jupyterlab = "*"
ipykernel = "*"

# JAX is NOT pinned at the top level on purpose (see CLAUDE.md "The JAX
# seam"). Each environment selects its backend build here instead.
[feature.cpu.dependencies]
jax = ">=0.7"
# Pin the CPU jaxlib build. conda-forge otherwise resolves the CUDA variant
# when the env is BUILT on a GPU host (e.g. a NERSC GPU login node), so the
# "cpu" env would grab the GPU and OOM. `cpu*` matches the conda-forge CPU
# builds on both osx-arm64 and linux-64.
jaxlib = { version = "*", build = "cpu*" }

[feature.cuda]
platforms = ["linux-64"]
system-requirements = { cuda = "12" }

[feature.cuda.dependencies]
jax = ">=0.7"
jaxlib = { version = "*", build = "cuda12*" }

# romanisim (spectro acceptance / wrap). Cross-platform; pulls galsim/asdf/
# roman_datamodels transitively. Pinned to spacetelescope/romanisim@main:
# the `--extra-counts` feature merged upstream but is not yet in a PyPI
# release (latest is 0.14.0, which predates it) — switch to a PyPI spec once
# a release > 0.14.0 ships it.
[feature.romanisim.dependencies]
fftw = "*"

[feature.romanisim.pypi-dependencies]
crds = ">=13.0.2"
stpsf = ">=2.1.0"
romanisim = { git = "https://github.com/spacetelescope/romanisim.git", branch = "main" }

# Maintainer-only authoring tools (see the `dev` environment above).
[feature.dev.dependencies]
nbstripout = "*"
