# Minimal conda environment for running the Roman Disperser tutorials on a
# laptop (CPU). NERSC and RRN users use their shared environments instead —
# see docs/SETUP.md — and do not build this file.
#
# The disperser is a PRIVATE repo: `gh auth login` (or an SSH key registered
# with GitHub) before `conda env create`, or the git clone below will fail.
#
# JAX is intentionally NOT pinned: a CPU `jax` floor arrives via
# roman_disperser. For GPU, install the right jax build per
# roman_disperser/INSTALL.md *after* creating this env (see docs/SETUP.md).
name: roman-disperser-tutorials
channels:
  - conda-forge
dependencies:
  - python=3.12
  - jupyterlab
  - ipykernel
  - pip
  - pip:
      # Pinned to v0.10.0 (first release with `roman-disperser-hydrate`); bump
      # as the tutorials track new disperser releases.
      - "roman_disperser[full] @ git+https://github.com/roman-grs-pit/roman_disperser.git@v0.10.0"
